<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R. Gayathri | AWS DevOps Portfolio</title>
    <style>
        body { background-color: #050b14; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .main-card { border: 2px solid #00f2ff; border-radius: 20px; padding: 40px; display: inline-block; background: rgba(0,0,0,0.85); box-shadow: 0 0 30px #00f2ff; max-width: 500px; margin-top: 30px; }
        
        /* Professional Circle Profile Image */
        .profile-pic { width: 160px; height: 160px; border-radius: 50%; border: 4px solid #00ff41; object-fit: cover; box-shadow: 0 0 20px #00ff41; margin-bottom: 20px; }
        
        h1 { color: #00ff41; text-transform: uppercase; letter-spacing: 3px; margin: 10px 0; font-size: 28px; text-shadow: 0 0 10px #00ff41; }
        .role { color: #00f2ff; font-weight: bold; margin-bottom: 20px; display: block; font-size: 18px; letter-spacing: 1px; }
        
        .skill-section { margin-top: 30px; text-align: left; }
        .skill-item { margin-bottom: 18px; }
        .skill-label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
        .bar-bg { background: #1a1a1a; height: 10px; border-radius: 10px; border: 1px solid #333; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #00f2ff, #00ff41); box-shadow: 0 0 10px #00ff41; transition: width 1s ease-in-out; }
        
        .projects { display: flex; justify-content: space-between; margin-top: 35px; gap: 10px; }
        .proj-card { border: 1px solid #00f2ff; padding: 12px; border-radius: 10px; font-size: 11px; width: 30%; background: rgba(0, 242, 255, 0.05); transition: 0.3s; }
        .proj-card:hover { background: rgba(0, 242, 255, 0.2); transform: translateY(-5px); }
        
        footer { margin-top: 40px; color: #555; font-size: 11px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="main-card">
        <!-- GitHub Profile Photo Link -->
        <img src="https://raw.githubusercontent.com/Gaya-3-123/my-assets/main/profile.jpg" alt="R. Gayathri" class="profile-pic">
        
        <h1>R. GAYATHRI</h1>
        <span class="role">AWS DEVOPS ENGINEER</span>

        <div class="skill-section">
            <div class="skill-item">
                <div class="skill-label"><span>AWS Cloud & DevOps</span><span>90%</span></div>
                <div class="bar-bg"><div class="bar-fill" style="width: 90%;"></div></div>
            </div>
            <div class="skill-item">
                <div class="skill-label"><span>Terraform & Automation</span><span>85%</span></div>
                <div class="bar-bg"><div class="bar-fill" style="width: 85%;"></div></div>
            </div>
            <div class="skill-item">
                <div class="skill-label"><span>IoT & Embedded (LoRaWAN)</span><span>80%</span></div>
                <div class="bar-bg"><div class="bar-fill" style="width: 80%;"></div></div>
            </div>
        </div>

        <div class="projects">
            <div class="proj-card"><b>LoRaWAN</b><br>IoT Project</div>
            <div class="proj-card"><b>AWS</b><br>Automation</div>
            <div class="proj-card"><b>Docker</b><br>Containers</div>
        </div>
        
        <footer>DESIGNED FOR CAREER READINESS • GAYATHRI R</footer>
    </div>
</body>
</html>
